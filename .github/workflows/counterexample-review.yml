name: Counterexample Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          # Full history is required: counterexample diffs `origin/main` against
          # the PR head to scope mutation testing to changed lines, and a shallow
          # clone would not have `origin/main`'s history available to diff against.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install counterexample
        run: pip install git+https://github.com/sadishihab/counterexample.git

      - name: Run counterexample review
        id: review
        run: |
          counterexample review --repo . --base origin/main --head HEAD --out review-receipt.html | tee review-summary.txt

          # Parse the CLI's own stdout summary instead of the HTML receipt: PR
          # comments only render markdown/plain text, not the self-contained
          # HTML report, so the full receipt is shipped as an artifact instead
          # (see the upload step below) and only a short summary goes in the comment.
          mutants=$(grep -oP 'Generated \K[0-9]+(?= mutant)' review-summary.txt)
          score=$(grep -oP 'Mutation score: \K[0-9]+' review-summary.txt)

          echo "mutants=$mutants" >> "$GITHUB_OUTPUT"
          echo "score=$score" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const score = Number("${{ steps.review.outputs.score }}");
            const mutants = "${{ steps.review.outputs.mutants }}";
            const verdict = score >= 80
              ? "✅ **LOOKS SOLID**"
              : "⚠️ **BUGS FOUND**";

            const body = [
              "## 🔎 Counterexample Review",
              "",
              `- Mutation score: **${score}%**`,
              `- Mutants generated: ${mutants}`,
              `- Verdict: ${verdict}`,
              "",
              "Full receipt: see the workflow's uploaded artifact.",
            ].join("\n");

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload review receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: review-receipt
          path: review-receipt.html
